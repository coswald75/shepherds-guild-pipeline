# Weekly ingest — Sunday submit, Monday catchup.
#
# NOTHING in this file is scheduled. The cron lines below are comments.
# GitHub Actions cron is UTC and ignores daylight saving time.
# America/Chicago is UTC-5 during CDT (roughly the second Sunday in March
# through the first Sunday in November) and UTC-6 during CST. When you
# enable a schedule, uncomment exactly ONE of the two schedule blocks
# (CDT or CST), never both, and only after the Mac launchd jobs are unloaded.
# The Mac jobs and these schedules must never both be live.
#
# Sunday 7:00pm America/Chicago — submit pass (mode=weekly, not a dry run)
# Monday 7:00am and 9:00am America/Chicago — catchup, then auto-process
#
# CDT (UTC-5):
# schedule:
#   - cron: "0 0 * * 1"   # Sunday 7:00pm CDT = Monday 00:00 UTC
#   - cron: "0 12 * * 1"  # Monday 7:00am CDT = Monday 12:00 UTC
#   - cron: "0 14 * * 1"  # Monday 9:00am CDT = Monday 14:00 UTC
#
# CST (UTC-6), one hour later in UTC:
# schedule:
#   - cron: "0 1 * * 1"   # Sunday 7:00pm CST = Monday 01:00 UTC
#   - cron: "0 13 * * 1"  # Monday 7:00am CST = Monday 13:00 UTC
#   - cron: "0 15 * * 1"  # Monday 9:00am CST = Monday 15:00 UTC
#
# Pending batches: Sunday writes weekly_queue/pending_batches.json and exits.
# That file is gitignored and is gone on the next runner. auto-process also
# asks Anthropic for recent batches and Supabase for sermons that are still
# unfinished, so Monday does not need Sunday's disk.
#
# The Mac waits up to 24h for a batch. GitHub-hosted jobs cap at 6 hours, so
# this workflow waits at most 5 hours and then stops cleanly. The next catchup
# (the 9am pass, or Run workflow again) resumes the same batch. It does not
# submit a second one.

name: Weekly ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly submits batches. catchup finishes them. discover-dry-run only lists what is new."
        type: choice
        options:
          - discover-dry-run
          - weekly
          - catchup
        default: discover-dry-run
      dry_run:
        description: "Stop after discover and write nothing. Leave this checked unless you mean to process sermons."
        type: boolean
        default: true
  # Temporary branch exercise. This push is forced to discover-dry-run below.
  # Remove this trigger after the check. It is not a schedule.
  push:
    branches:
      - cursor/actions-dispatch-only-7654

# One sermon pipeline at a time, including Cross of Grace. Queued, not cancelled,
# so a long batch wait is not thrown away when the next clock time arrives.
concurrency:
  group: sermon-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    name: Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # These three are not passwords. Put them in Settings → Secrets and
      # variables → Actions → Variables. A copy stored as a secret still works.
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE || secrets.R2_PUBLIC_BASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERMON_STEWARD_REPO: ${{ github.workspace }}/sermon-steward
      BATCH_MAX_WAIT_HOURS: "5"
    steps:
      - name: Check out the pipeline
        uses: actions/checkout@v4

      - name: Decide what this run will do
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          INPUT_MODE: ${{ github.event_name == 'push' && 'discover-dry-run' || inputs.mode }}
          INPUT_DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            export EVENT_NAME=workflow_dispatch
            export EVENT_JSON='{}'
          fi
          python3 .github/scripts/plan_weekly_run.py

      - name: Retry publish if the last run failed
        id: retry
        if: steps.plan.outputs.needs_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry=false
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            retry=true
          else
            conclusion="$(gh run list --workflow weekly-ingest.yml --limit 8 --json databaseId,conclusion --jq "first(.[] | select(.databaseId != ${GITHUB_RUN_ID} and .conclusion != null) | .conclusion)" || true)"
            if [ "${conclusion}" = "failure" ]; then
              retry=true
            fi
          fi
          echo "retry=${retry}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check out sermon-steward
        if: steps.plan.outputs.needs_publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: coswald75/sermon-steward
          token: ${{ secrets.SERMON_STEWARD_PUSH_TOKEN }}
          path: sermon-steward

      - name: Set up Node
        if: steps.plan.outputs.needs_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sermon-steward dependencies
        if: steps.plan.outputs.needs_publish == 'true'
        working-directory: sermon-steward
        run: npm ci

      - name: Install Chromium for share cards
        if: steps.plan.outputs.needs_publish == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Set git identity for sermon-steward commits
        if: steps.plan.outputs.needs_publish == 'true'
        working-directory: sermon-steward
        run: |
          git config user.name "Sermon Steward pipeline"
          git config user.email "chris@sovgracekc.org"

      - name: Run weekly ingest
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
          PUBLISH_RETRY: ${{ steps.retry.outputs.retry }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          echo "mode=${MODE} dry_run=${DRY_RUN}"
          if [ "${MODE}" != "discover-dry-run" ] || [ "${DRY_RUN}" != "true" ]; then
            echo "Refusing to run: this branch push must stay a discover dry run." >&2
            exit 1
          fi
          case "${MODE}" in
            discover-dry-run)
              python weekly_ingest.py discover --dry-run
              ;;
            weekly)
              if [ "${DRY_RUN}" = "true" ]; then
                python weekly_ingest.py weekly --dry-run
              else
                python weekly_ingest.py weekly
              fi
              ;;
            catchup)
              if [ "${DRY_RUN}" = "true" ]; then
                python weekly_ingest.py weekly --catchup --dry-run
              else
                python weekly_ingest.py weekly --catchup
                python weekly_ingest.py auto-process
              fi
              ;;
            *)
              echo "Unknown mode: ${MODE}" >&2
              exit 1
              ;;
          esac

  alert:
    name: Email Chris
    needs: ingest
    if: failure() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pipeline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send the failure email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: python scripts/check_stuck_sermons.py --workflow-failure --run-url "${RUN_URL}" --workflow-name "${WORKFLOW_NAME}"
