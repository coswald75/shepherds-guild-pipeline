# Temporary read-only authentication check for this branch.
# Delete this file after the run. It is not a schedule and it does not
# write to Supabase, R2, or sermon-steward. It does not send mail unless
# the Resend key is send-only and a read call is rejected; that one message
# goes to Chris and is labeled as a key check, not a pipeline failure.

name: Secret auth probe

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read-only. This probe never writes."
        type: boolean
        default: true
  push:
    branches:
      - cursor/actions-dispatch-only-7654

permissions:
  contents: read

jobs:
  probe:
    name: Read-only auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: python -m pip install boto3

      - name: Prove each secret without writing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE || secrets.R2_PUBLIC_BASE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERMON_STEWARD_PUSH_TOKEN: ${{ secrets.SERMON_STEWARD_PUSH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          import boto3

          SECRET_NAMES = (
              "ANTHROPIC_API_KEY",
              "VOYAGE_API_KEY",
              "ASSEMBLYAI_API_KEY",
              "SUPABASE_URL",
              "SUPABASE_KEY",
              "R2_ACCOUNT_ID",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET",
              "R2_PUBLIC_BASE",
              "RESEND_API_KEY",
              "RESEND_FROM",
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
              "SERMON_STEWARD_PUSH_TOKEN",
          )


          def scrub(text: str) -> str:
              cleaned = text
              for name in SECRET_NAMES:
                  value = os.environ.get(name) or ""
                  if value:
                      cleaned = cleaned.replace(value, "***")
              return cleaned[:500]


          def call(method: str, url: str, headers: dict, body=None, timeout: int = 45):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as err:
                  detail = err.read().decode(errors="replace")
                  raise RuntimeError(f"HTTP {err.code}: {scrub(detail)}") from None


          def require(name: str) -> str:
              value = (os.environ.get(name) or "").strip()
              if not value:
                  raise RuntimeError(f"{name} is empty")
              return value


          results = []


          def check(name, fn):
              try:
                  detail = fn()
                  results.append((name, True, detail))
                  print(f"PASS {name}: {detail}")
              except Exception as exc:
                  detail = scrub(str(exc))
                  results.append((name, False, detail))
                  print(f"FAIL {name}: {detail}")


          def anthropic():
              key = require("ANTHROPIC_API_KEY")
              status, raw = call(
                  "GET",
                  "https://api.anthropic.com/v1/models?limit=1",
                  {"x-api-key": key, "anthropic-version": "2023-06-01"},
              )
              payload = json.loads(raw or "{}")
              count = len(payload.get("data") or [])
              return f"HTTP {status}, models_page={count}"


          def voyage():
              key = require("VOYAGE_API_KEY")
              last = "no attempt"
              for model in ("voyage-4-lite", "voyage-3.5-lite", "voyage-3-lite"):
                  try:
                      status, raw = call(
                          "POST",
                          "https://api.voyageai.com/v1/embeddings",
                          {
                              "Authorization": f"Bearer {key}",
                              "Content-Type": "application/json",
                          },
                          {"input": ["ping"], "model": model, "input_type": "query"},
                      )
                  except RuntimeError as exc:
                      last = str(exc)
                      if "HTTP 400" in last or "HTTP 404" in last:
                          continue
                      raise
                  payload = json.loads(raw or "{}")
                  vectors = ((payload.get("data") or [{}])[0].get("embedding") or [])
                  return f"HTTP {status}, model={model}, dims={len(vectors)}"
              raise RuntimeError(last)


          def assemblyai():
              key = require("ASSEMBLYAI_API_KEY")
              status, raw = call(
                  "GET",
                  "https://api.assemblyai.com/v2/transcript?limit=1",
                  {"authorization": key},
              )
              payload = json.loads(raw or "{}")
              listed = payload.get("transcripts")
              count = len(listed) if isinstance(listed, list) else 0
              return f"HTTP {status}, transcripts_page={count}"


          def supabase():
              url = require("SUPABASE_URL").rstrip("/")
              key = require("SUPABASE_KEY")
              status, raw = call(
                  "GET",
                  f"{url}/rest/v1/churches?select=id&limit=1",
                  {
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                      "Accept": "application/json",
                  },
              )
              payload = json.loads(raw or "[]")
              count = len(payload) if isinstance(payload, list) else 0
              return f"HTTP {status}, churches_page={count}"


          def r2():
              account = require("R2_ACCOUNT_ID")
              bucket = require("R2_BUCKET")
              require("R2_PUBLIC_BASE")
              client = boto3.client(
                  "s3",
                  endpoint_url=f"https://{account}.r2.cloudflarestorage.com",
                  aws_access_key_id=require("R2_ACCESS_KEY_ID"),
                  aws_secret_access_key=require("R2_SECRET_ACCESS_KEY"),
                  region_name="auto",
              )
              resp = client.list_objects_v2(Bucket=bucket, MaxKeys=1)
              code = resp["ResponseMetadata"]["HTTPStatusCode"]
              return f"HTTP {code}, key_count={resp.get('KeyCount')}, public_base=set"


          def resend():
              key = require("RESEND_API_KEY")
              sender = require("RESEND_FROM")
              headers = {"Authorization": f"Bearer {key}"}
              for path in ("/domains", "/emails?limit=1"):
                  try:
                      status, raw = call("GET", "https://api.resend.com" + path, headers)
                  except RuntimeError as exc:
                      message = str(exc)
                      if "HTTP 401" in message or "HTTP 403" in message:
                          continue
                      raise
                  return f"HTTP {status} GET {path}, from_set=yes"
              # Send-only keys cannot list. One labeled message to Chris, not a failure alert.
              status, raw = call(
                  "POST",
                  "https://api.resend.com/emails",
                  {**headers, "Content-Type": "application/json"},
                  {
                      "from": sender,
                      "to": ["chris@sovgracekc.org"],
                      "subject": "Sermon Steward: Resend key check (not a pipeline failure)",
                      "text": (
                          "This is a one-time check that the Actions Resend key can send. "
                          "No sermon was processed. Nothing was written to Supabase, R2, "
                          "or sermon-steward. The read endpoints rejected this key, which "
                          "is what a send-only key does."
                      ),
                  },
              )
              payload = json.loads(raw or "{}")
              message_id = payload.get("id") or "accepted"
              return f"HTTP {status} POST /emails to Chris only, id={message_id}"


          def cloudflare():
              token = require("CLOUDFLARE_API_TOKEN")
              account = require("CLOUDFLARE_ACCOUNT_ID")
              headers = {"Authorization": f"Bearer {token}"}
              status, raw = call(
                  "GET",
                  "https://api.cloudflare.com/client/v4/user/tokens/verify",
                  headers,
              )
              payload = json.loads(raw or "{}")
              token_status = ((payload.get("result") or {}).get("status")) or "unknown"
              acct_status, acct_raw = call(
                  "GET",
                  f"https://api.cloudflare.com/client/v4/accounts/{account}",
                  headers,
              )
              acct = json.loads(acct_raw or "{}")
              name = ((acct.get("result") or {}).get("name")) or "account"
              return f"verify HTTP {status} status={token_status}; account HTTP {acct_status} name={name}"


          def sermon_steward():
              token = require("SERMON_STEWARD_PUSH_TOKEN")
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "sermon-steward-dry-run",
              }
              status, raw = call(
                  "GET",
                  "https://api.github.com/repos/coswald75/sermon-steward/git/ref/heads/main",
                  headers,
              )
              payload = json.loads(raw or "{}")
              ref = payload.get("ref") or ""
              has_sha = bool(((payload.get("object") or {}).get("sha")))
              if ref != "refs/heads/main" or not has_sha:
                  raise RuntimeError("token did not return the main ref")
              return f"HTTP {status}, read main ref=yes, push=not attempted"


          check("Anthropic", anthropic)
          check("Voyage", voyage)
          check("AssemblyAI", assemblyai)
          check("Supabase", supabase)
          check("R2", r2)
          check("Resend", resend)
          check("Cloudflare", cloudflare)
          check("sermon-steward token", sermon_steward)

          failed = [name for name, ok, _detail in results if not ok]
          print("---")
          print(f"{len(results) - len(failed)} passed, {len(failed)} failed")
          if failed:
              raise SystemExit(1)
          PY
