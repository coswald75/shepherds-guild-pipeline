<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guild Hall — Preacher Profiles</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Chart.js — official recommended CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1612;
      --bg-card: #231f1a;
      --bg-card-hover: #2a2520;
      --gold: #c4a265;
      --gold-dim: #9a7d4e;
      --gold-bright: #d4b87a;
      --burgundy: #8b3a3a;
      --burgundy-light: #a85454;
      --forest: #3a5a3a;
      --forest-light: #4a7a4a;
      --cream: #e8dcc8;
      --warm-gray: #8a7e6e;
      --text: #d4c5a9;
      --text-dim: #8a7e6e;
      --border: #3a3228;
      --border-light: #4a4238;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .fade-in { animation: fadeIn 0.4s ease-out both; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Layout ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .header-brand { font-family: 'Cormorant Garamond', serif; font-size: 11px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 4px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: var(--gold); line-height: 1.2; }
    main { padding: 28px 32px; max-width: 1200px; margin: 0 auto; }
    footer { border-top: 1px solid var(--border); padding: 20px 32px; text-align: center; margin-top: 40px; }
    .footer-brand { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: var(--gold-dim); letter-spacing: 0.08em; }
    .footer-sub { font-size: 11px; color: var(--warm-gray); margin-top: 4px; }

    /* ── Nav Tabs ── */
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 16px; font-size: 12px; font-weight: 500;
      cursor: pointer; text-transform: capitalize;
      font-family: 'DM Sans', sans-serif; transition: all 0.2s;
    }
    .nav-tab.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

    /* ── Stat Cards ── */
    .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 20px 24px; flex: 1 1 180px; min-width: 160px;
    }
    .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; color: var(--gold); line-height: 1.1; }
    .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--warm-gray); margin-top: 4px; }

    /* ── Chart Cards ── */
    .chart-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 24px; margin-bottom: 24px;
    }
    .chart-card h3, .chart-card h4 {
      font-family: 'Cormorant Garamond', serif; color: var(--gold); margin-bottom: 20px;
    }
    .chart-card h3 { font-size: 18px; }
    .chart-card h4 { font-size: 16px; }
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

    /* ── Preacher Cards ── */
    .preacher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .preacher-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 18px 20px; cursor: pointer; text-align: left; transition: all 0.2s;
    }
    .preacher-card:hover { border-color: var(--gold-dim); background: var(--bg-card-hover); }
    .preacher-card .name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--cream); }
    .preacher-card .metrics { display: flex; gap: 20px; margin-top: 10px; }
    .preacher-card .metric-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--gold); }
    .preacher-card .metric-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .preacher-card .func-bar { margin-top: 12px; display: flex; gap: 2px; height: 4px; border-radius: 2px; overflow: hidden; }

    /* ── Pill Buttons ── */
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .pill {
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 6px 14px; font-size: 12px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.2s;
    }
    .pill.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

    /* ── Detail Layout ── */
    .detail-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--cream); font-weight: 600; margin-bottom: 4px; }
    .detail-header .meta { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }
    .type-badges { display: flex; gap: 12px; flex-wrap: wrap; }
    .type-badge {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px 18px; text-align: center;
    }
    .type-badge .count { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: var(--gold); }
    .type-badge .label { font-size: 11px; color: var(--text-dim); text-transform: capitalize; margin-top: 2px; }

    /* ── Sermon List ── */
    .sermon-list { max-height: 300px; overflow-y: auto; }
    .sermon-row {
      padding: 10px 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .sermon-row .title { color: var(--cream); font-size: 13px; }
    .sermon-row .ref { color: var(--gold-dim); font-size: 11px; margin-left: 10px; }
    .sermon-row .units { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--warm-gray); white-space: nowrap; margin-left: 12px; }

    /* ── Loading / Error ── */
    .loading-skeleton {
      height: 80px; border-radius: 4px; margin-bottom: 16px;
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
    }
    .error-screen { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .error-screen h2 { font-size: 18px; font-weight: 600; color: var(--burgundy-light); margin-bottom: 12px; }
    .error-screen p { font-size: 13px; color: var(--text-dim); max-width: 400px; }
    .placeholder { text-align: center; padding: 60px; color: var(--text-dim); }
    .placeholder h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--gold-dim); margin-bottom: 8px; }

    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold); margin-bottom: 16px; }

    @media (max-width: 768px) {
      .chart-grid { grid-template-columns: 1fr; }
      header { padding: 16px 20px; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="header-brand">Shepherd's Guild</div>
      <h1>Guild Hall — Preacher Profiles</h1>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
  </header>

  <main id="main-content">
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
  </main>

  <footer>
    <div class="footer-brand">Shepherd's Guild</div>
    <div class="footer-sub">Guild Hall Dashboard · Live from Supabase</div>
  </footer>

  <script>
    // ══════════════════════════════════════════════════════════════
    // Config
    // ══════════════════════════════════════════════════════════════
    const SUPABASE_URL = "https://twbunmbzyqcqzgffdrib.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3YnVubWJ6eXFjcXpnZmZkcmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1ODgxODUsImV4cCI6MjA4NzE2NDE4NX0.8Y6tMnX5bhIWxTS7llFZElPY-st7rji0MtlTzxeqiW8";

    const CHART_PALETTE = ["#c4a265", "#8b3a3a", "#3a5a3a", "#7a6a5a", "#a85454", "#4a7a4a", "#d4b87a", "#6a4a4a", "#5a7a5a"];
    const RHETORICAL_COLORS = {
      exposition: "#c4a265", theological_claim: "#8b3a3a", illustration: "#3a5a3a",
      application: "#7a6a5a", introduction: "#a85454", conclusion: "#4a7a4a",
      transition: "#5a5040", pastoral_aside: "#d4b87a", prayer: "#6a5a4a",
    };

    // Chart.js global defaults
    Chart.defaults.color = "#8a7e6e";
    Chart.defaults.borderColor = "#3a3228";
    Chart.defaults.font.family = "'DM Sans', sans-serif";
    Chart.defaults.font.size = 11;
    Chart.defaults.plugins.legend.labels.boxWidth = 12;
    Chart.defaults.plugins.legend.labels.padding = 16;
    Chart.defaults.plugins.tooltip.backgroundColor = "#231f1a";
    Chart.defaults.plugins.tooltip.borderColor = "#3a3228";
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.titleFont = { family: "'DM Sans', sans-serif", weight: "600", size: 12 };
    Chart.defaults.plugins.tooltip.titleColor = "#c4a265";
    Chart.defaults.plugins.tooltip.bodyFont = { family: "'JetBrains Mono', monospace", size: 11 };
    Chart.defaults.plugins.tooltip.bodyColor = "#d4c5a9";
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 6;

    // ══════════════════════════════════════════════════════════════
    // Supabase Query
    // ══════════════════════════════════════════════════════════════
    async function supaQuery(table, params = {}) {
      const url = new URL(SUPABASE_URL + "/rest/v1/" + table);
      Object.entries(params).forEach(function(kv) { url.searchParams.set(kv[0], kv[1]); });
      const res = await fetch(url.toString(), {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        },
      });
      if (!res.ok) throw new Error("Supabase " + res.status + ": " + res.statusText);
      return res.json();
    }

    // Paginated fetch — pulls in batches using offset & limit query params
    async function supaQueryAll(table, params, pageSize) {
      pageSize = pageSize || 1000;
      var allRows = [];
      var offset = 0;
      while (true) {
        var url = new URL(SUPABASE_URL + "/rest/v1/" + table);
        Object.entries(params || {}).forEach(function(kv) { url.searchParams.set(kv[0], kv[1]); });
        url.searchParams.set("limit", String(pageSize));
        url.searchParams.set("offset", String(offset));
        console.log("[supaQueryAll] Fetching offset=" + offset + " limit=" + pageSize);
        var res = await fetch(url.toString(), {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            Prefer: "return=representation",
          },
        });
        if (!res.ok) throw new Error("Supabase " + res.status + ": " + res.statusText);
        var rows = await res.json();
        console.log("[supaQueryAll] Got " + rows.length + " rows at offset " + offset);
        allRows = allRows.concat(rows);
        if (rows.length < pageSize) break;
        offset += pageSize;
      }
      console.log("[supaQueryAll] TOTAL: " + allRows.length);
      return allRows;
    }

    // ══════════════════════════════════════════════════════════════
    // State
    // ══════════════════════════════════════════════════════════════
    var state = {
      preachers: [], sermons: [], units: [],
      preacherStats: [], sermonsByPreacher: {}, unitsBySermon: {},
      currentView: "overview",
      selectedPreacher: null,
      charts: {},
    };

    // ══════════════════════════════════════════════════════════════
    // Data Processing
    // ══════════════════════════════════════════════════════════════
    function processData() {
      var preachers = state.preachers;
      var sermons = state.sermons;
      var units = state.units;

      var sermonsByPreacher = {};
      sermons.forEach(function(s) {
        if (!sermonsByPreacher[s.preacher_id]) sermonsByPreacher[s.preacher_id] = [];
        sermonsByPreacher[s.preacher_id].push(s);
      });

      var unitsBySermon = {};
      units.forEach(function(u) {
        if (!unitsBySermon[u.sermon_id]) unitsBySermon[u.sermon_id] = [];
        unitsBySermon[u.sermon_id].push(u);
      });

      var preacherStats = preachers.map(function(p) {
        var slist = sermonsByPreacher[p.id] || [];
        var ulist = [];
        slist.forEach(function(s) { (unitsBySermon[s.id] || []).forEach(function(u) { ulist.push(u); }); });
        var funcCounts = {};
        var lociCounts = {};
        ulist.forEach(function(u) {
          if (u.rhetorical_function) funcCounts[u.rhetorical_function] = (funcCounts[u.rhetorical_function] || 0) + 1;
          if (u.doctrinal_loci && Array.isArray(u.doctrinal_loci)) {
            u.doctrinal_loci.forEach(function(l) { lociCounts[l] = (lociCounts[l] || 0) + 1; });
          }
        });
        var sermonTypes = {};
        slist.forEach(function(s) {
          if (s.sermon_type) sermonTypes[s.sermon_type] = (sermonTypes[s.sermon_type] || 0) + 1;
        });
        return {
          id: p.id, name: p.name, is_canonical: p.is_canonical,
          sermonCount: slist.length,
          unitCount: ulist.length,
          avgUnits: slist.length ? (ulist.length / slist.length).toFixed(1) : "—",
          funcCounts: funcCounts,
          lociCounts: lociCounts,
          sermonTypes: sermonTypes,
        };
      }).filter(function(p) { return p.sermonCount > 0; });

      state.preacherStats = preacherStats;
      state.sermonsByPreacher = sermonsByPreacher;
      state.unitsBySermon = unitsBySermon;
    }

    // ══════════════════════════════════════════════════════════════
    // Chart Helpers
    // ══════════════════════════════════════════════════════════════
    function destroyChart(id) {
      if (state.charts[id]) { state.charts[id].destroy(); delete state.charts[id]; }
    }

    function destroyAllCharts() {
      Object.keys(state.charts).forEach(destroyChart);
    }

    function createChart(canvasId, config) {
      destroyChart(canvasId);
      var ctx = document.getElementById(canvasId);
      if (!ctx) return;
      state.charts[canvasId] = new Chart(ctx, config);
    }

    // ══════════════════════════════════════════════════════════════
    // Navigation
    // ══════════════════════════════════════════════════════════════
    function initNav() {
      var container = document.getElementById("nav-tabs");
      ["overview", "compare", "detail"].forEach(function(v) {
        var btn = document.createElement("button");
        btn.className = "nav-tab" + (v === state.currentView ? " active" : "");
        btn.textContent = v;
        btn.setAttribute("data-view", v);
        btn.onclick = function() {
          state.currentView = v;
          document.querySelectorAll(".nav-tab").forEach(function(b) { b.classList.remove("active"); });
          btn.classList.add("active");
          render();
        };
        container.appendChild(btn);
      });
    }

    // ══════════════════════════════════════════════════════════════
    // Renderers
    // ══════════════════════════════════════════════════════════════
    function render() {
      destroyAllCharts();
      var main = document.getElementById("main-content");
      if (state.currentView === "overview") renderOverview(main);
      else if (state.currentView === "compare") renderCompare(main);
      else if (state.currentView === "detail") renderDetail(main);
    }

    // ── Overview ──
    function renderOverview(main) {
      var ps = state.preacherStats;
      var totalSermons = state.sermons.length;
      var totalUnits = state.units.length;
      var avgUnits = totalSermons ? (totalUnits / totalSermons).toFixed(1) : "0";
      var pct = (totalSermons / 330 * 100).toFixed(0);

      var barData = ps.map(function(p) {
        return { name: (p.name || "").split(" ").pop() || "?", sermons: p.sermonCount };
      }).sort(function(a, b) { return b.sermons - a.sermons; });

      main.innerHTML =
        '<div class="fade-in">' +
          '<div class="stats-row">' +
            '<div class="stat-card"><div class="stat-value">' + ps.length + '</div><div class="stat-label">Preachers</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + totalSermons + '</div><div class="stat-label">Sermons Processed</div><div class="stat-sub">of 330 target (' + pct + '%)</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + totalUnits.toLocaleString() + '</div><div class="stat-label">Functional Units</div></div>' +
            '<div class="stat-card"><div class="stat-value">' + avgUnits + '</div><div class="stat-label">Avg Units / Sermon</div></div>' +
          '</div>' +
          '<div class="chart-card"><h3>Sermons per Preacher</h3><div style="position:relative;height:280px"><canvas id="chart-sermons-bar"></canvas></div></div>' +
          '<div class="section-title">Preacher Index</div>' +
          '<div class="preacher-grid" id="preacher-grid"></div>' +
        '</div>';

      createChart("chart-sermons-bar", {
        type: "bar",
        data: {
          labels: barData.map(function(d) { return d.name; }),
          datasets: [{ label: "Sermons", data: barData.map(function(d) { return d.sermons; }), backgroundColor: "#c4a265", borderRadius: 4 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { display: false }, ticks: { font: { family: "'JetBrains Mono', monospace" } } },
            x: { grid: { display: false } },
          },
        },
      });

      // Preacher cards
      var grid = document.getElementById("preacher-grid");
      ps.forEach(function(p) {
        var card = document.createElement("div");
        card.className = "preacher-card";
        card.onclick = function() {
          state.selectedPreacher = p.id;
          state.currentView = "detail";
          document.querySelectorAll(".nav-tab").forEach(function(b) { b.classList.remove("active"); });
          var detailBtn = document.querySelector('.nav-tab[data-view="detail"]');
          if (detailBtn) detailBtn.classList.add("active");
          render();
        };

        var topFuncs = Object.entries(p.funcCounts).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 5);
        var barHtml = topFuncs.map(function(kv) {
          return '<div style="flex:' + kv[1] + ';background:' + (RHETORICAL_COLORS[kv[0]] || '#8a7e6e') + ';min-width:2px" title="' + kv[0] + ': ' + kv[1] + '"></div>';
        }).join("");

        card.innerHTML =
          '<div class="name">' + p.name + '</div>' +
          '<div class="metrics">' +
            '<div><div class="metric-val">' + p.sermonCount + '</div><div class="metric-label">sermons</div></div>' +
            '<div><div class="metric-val">' + p.unitCount + '</div><div class="metric-label">units</div></div>' +
            '<div><div class="metric-val">' + p.avgUnits + '</div><div class="metric-label">avg/sermon</div></div>' +
          '</div>' +
          '<div class="func-bar">' + barHtml + '</div>';
        grid.appendChild(card);
      });
    }

    // ── Compare ──
    function renderCompare(main) {
      var ps = state.preacherStats;
      var functions = ["exposition", "theological_claim", "illustration", "application", "pastoral_aside", "transition"];
      var funcLabels = functions.map(function(f) { return f.replace(/_/g, " "); });

      var datasets = ps.map(function(p, i) {
        return {
          label: p.name,
          data: functions.map(function(fn) { return ((p.funcCounts[fn] || 0) / (p.unitCount || 1)) * 100; }),
          borderColor: CHART_PALETTE[i % CHART_PALETTE.length],
          backgroundColor: CHART_PALETTE[i % CHART_PALETTE.length] + "14",
          borderWidth: 2, pointRadius: 3,
          pointBackgroundColor: CHART_PALETTE[i % CHART_PALETTE.length],
        };
      });

      var avgBarData = ps.map(function(p) {
        return { name: (p.name || "").split(" ").pop() || "?", avgUnits: parseFloat(p.avgUnits) || 0 };
      }).sort(function(a, b) { return b.avgUnits - a.avgUnits; });

      main.innerHTML =
        '<div class="fade-in">' +
          '<h3 style="font-family:\'Cormorant Garamond\',serif;font-size:20px;color:var(--gold);margin-bottom:8px">Rhetorical Profile Comparison</h3>' +
          '<p style="font-size:13px;color:var(--text-dim);margin-bottom:24px">Each axis shows what percentage of a preacher\'s total units serve that rhetorical function.</p>' +
          '<div class="chart-card"><div style="position:relative;height:450px"><canvas id="chart-radar"></canvas></div></div>' +
          '<div class="chart-card"><h3>Average Units per Sermon</h3><div style="position:relative;height:250px"><canvas id="chart-avg-bar"></canvas></div></div>' +
        '</div>';

      createChart("chart-radar", {
        type: "radar",
        data: { labels: funcLabels, datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            r: {
              grid: { color: "#3a3228" }, angleLines: { color: "#3a3228" },
              ticks: { backdropColor: "transparent", font: { size: 10 } },
              pointLabels: { font: { family: "'DM Sans', sans-serif", size: 11 } },
            },
          },
          plugins: { legend: { position: "bottom" } },
        },
      });

      createChart("chart-avg-bar", {
        type: "bar",
        data: {
          labels: avgBarData.map(function(d) { return d.name; }),
          datasets: [{ label: "Avg Units", data: avgBarData.map(function(d) { return d.avgUnits; }), backgroundColor: "#8b3a3a", borderRadius: 4 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { display: false }, ticks: { font: { family: "'JetBrains Mono', monospace" } } },
            x: { grid: { display: false } },
          },
        },
      });
    }

    // ── Detail ──
    function renderDetail(main) {
      var ps = state.preacherStats;
      var detail = null;
      for (var i = 0; i < ps.length; i++) {
        if (ps[i].id === state.selectedPreacher) { detail = ps[i]; break; }
      }

      var pillsHtml = ps.map(function(p) {
        return '<button class="pill' + (p.id === state.selectedPreacher ? ' active' : '') + '" data-id="' + p.id + '">' + (p.name || "").split(" ").pop() + '</button>';
      }).join("");

      if (!detail) {
        main.innerHTML =
          '<div class="fade-in">' +
            '<div class="pill-row">' + pillsHtml + '</div>' +
            '<div class="placeholder"><h3>Select a Preacher</h3><p style="font-size:13px">Choose from the buttons above to see detailed profile stats.</p></div>' +
          '</div>';
        bindPills();
        return;
      }

      var funcData = Object.entries(detail.funcCounts).sort(function(a, b) { return b[1] - a[1]; });
      var lociData = Object.entries(detail.lociCounts).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 10);

      var typeBadges = Object.entries(detail.sermonTypes).sort(function(a, b) { return b[1] - a[1]; })
        .map(function(kv) { return '<div class="type-badge"><div class="count">' + kv[1] + '</div><div class="label">' + kv[0] + '</div></div>'; }).join("");

      var sermonList = (state.sermonsByPreacher[detail.id] || []).map(function(s) {
        var uCount = (state.unitsBySermon[s.id] || []).length;
        return '<div class="sermon-row">' +
          '<div><span class="title">' + (s.title || "Untitled") + '</span>' + (s.primary_text ? '<span class="ref">' + s.primary_text + '</span>' : '') + '</div>' +
          '<div class="units">' + uCount + ' units</div>' +
        '</div>';
      }).join("");

      main.innerHTML =
        '<div class="fade-in">' +
          '<div class="pill-row">' + pillsHtml + '</div>' +
          '<div class="detail-header">' +
            '<h2>' + detail.name + '</h2>' +
            '<div class="meta">' + detail.sermonCount + ' sermons · ' + detail.unitCount + ' units · ' + detail.avgUnits + ' avg units/sermon</div>' +
          '</div>' +
          '<div class="chart-grid">' +
            '<div class="chart-card"><h4>Rhetorical Function Distribution</h4><div style="position:relative;height:280px"><canvas id="chart-detail-pie"></canvas></div></div>' +
            '<div class="chart-card"><h4>Top Doctrinal Loci</h4><div style="position:relative;height:280px"><canvas id="chart-detail-loci"></canvas></div></div>' +
          '</div>' +
          (typeBadges ? '<div class="chart-card"><h4>Sermon Types</h4><div class="type-badges">' + typeBadges + '</div></div>' : '') +
          '<div class="chart-card"><h4>Sermons</h4><div class="sermon-list">' + (sermonList || '<div style="color:var(--text-dim)">No sermons found.</div>') + '</div></div>' +
        '</div>';

      bindPills();

      // Doughnut chart
      createChart("chart-detail-pie", {
        type: "doughnut",
        data: {
          labels: funcData.map(function(kv) { return kv[0].replace(/_/g, " "); }),
          datasets: [{
            data: funcData.map(function(kv) { return kv[1]; }),
            backgroundColor: funcData.map(function(kv) { return RHETORICAL_COLORS[kv[0]] || "#c4a265"; }),
            borderColor: "#231f1a", borderWidth: 2,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: "45%",
          plugins: { legend: { position: "bottom", labels: { font: { size: 10 } } } },
        },
      });

      // Horizontal bar
      createChart("chart-detail-loci", {
        type: "bar",
        data: {
          labels: lociData.map(function(kv) { return kv[0]; }),
          datasets: [{ label: "Units", data: lociData.map(function(kv) { return kv[1]; }), backgroundColor: "#3a5a3a", borderRadius: 4 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, indexAxis: "y",
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { family: "'JetBrains Mono', monospace" } } },
            y: { grid: { display: false }, ticks: { font: { size: 10 } } },
          },
        },
      });
    }

    function bindPills() {
      document.querySelectorAll(".pill").forEach(function(btn) {
        btn.onclick = function() {
          state.selectedPreacher = btn.getAttribute("data-id");
          render();
        };
      });
    }

    // ══════════════════════════════════════════════════════════════
    // Init
    // ══════════════════════════════════════════════════════════════
    async function init() {
      initNav();
      try {
        var results = await Promise.all([
          supaQuery("preachers", { select: "*", order: "name.asc" }),
          supaQuery("sermons", { select: "id,title,preacher_id,primary_text,sermon_type,hermeneutical_method,tone,date,series_name", order: "preacher_id.asc" }),
          supaQueryAll("units", { select: "id,sermon_id,rhetorical_function,doctrinal_loci,unit_index" }),
        ]);
        state.preachers = results[0] || [];
        state.sermons = results[1] || [];
        state.units = results[2] || [];
        processData();
        render();
      } catch (e) {
        document.getElementById("main-content").innerHTML =
          '<div class="error-screen"><div style="text-align:center">' +
            '<h2>Connection Error</h2>' +
            '<p>' + e.message + '</p>' +
          '</div></div>';
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
